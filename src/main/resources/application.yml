spring:
  application:
    name: lab-management-system-springboot

  # 默认 profile=sso（真 SaasAuthClient/SaasMeClient，调 saas OAuth）。
  # 4 个 saas env（LAB_SAAS_BASE/CLIENT_ID/CLIENT_SECRET/DEFAULT_TENANT_ID）必填，
  # 缺一启动即被 fail-fast 拒绝（SsoBeansConfig）。
  # 离线 dev：LAB_PROFILE=no-sso 切回 NoopSaasAuthClient。
  # 注意用 spring.profiles.default 而不是 spring.config.activate.on-profile：
  # 后者是「条件包含本配置文档」的守卫，且 profile 名不解析占位符 ——
  # 写在那会把整份 application.yml（含 datasource）变成永不加载。
  profiles:
    default: ${LAB_PROFILE:sso}

  # postgres 直连（ADR 决议 2026-08-18）：lab-shared SQL 本就是 postgres 方言 V001-V013，
  # Flyway 直接 replay，不搞 sqlite 双栈。
  # 与 nextjs 共用一个库：默认指向 lab_dev（100.79.128.25，同 nextjs .env.local 的
  # DATABASE_URL）。LAB_DB_URL 可切走（如空库 replay 演练 / 未来独立实例）。
  datasource:
    url: ${LAB_DB_URL:jdbc:postgresql://100.79.128.25:5432/lab_dev}
    username: ${LAB_DB_USER:postgres}
    password: ${LAB_DB_PASSWORD:qiand68+++}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # lab_dev 已由 nextjs 侧（shared schema 同步）建到 V013 等效状态，且无
    # flyway_schema_history：baseline-on-migrate 在其上打 baseline 并跳过 <=13；
    # 空库则不触发 baseline、V001-V013 全量 replay。prod 慎用。
    baseline-on-migrate: true
    baseline-version: "13"
  jpa:
    hibernate:
      # schema 由 Flyway 管（SSOT = shared 仓 sql/migrations），Hibernate 只校验。
      ddl-auto: validate
    open-in-view: false

server:
  # 家族端口约定：springboot=8080（conventions §6）。CORS allowlist 见 WebConfig。
  port: 8080

# 健康探针只暴露 health（Docker HEALTHCHECK + deploy 脚本 wget 用）。
# 不开 metrics/env/heapdump 等敏感面（同 saas-springboot）。
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    io.xr.lab: DEBUG

# B1 真后端 OAuth 2.0 + JWT 签发配置（ADR-0008）。
# - Jwt 密钥 ≥32B（HS256），dev 默认占位即可；prod 必走 env。
# - Sso 4 字段 saas-base/client-id/client-secret/default-tenant-id 缺一不可。
# - dev 默认 profile=no-sso（NoopSaasAuthClient），无需 saas 也跑通。
# - prod/CI 切 default profile 走真 saas。
lab:
  jwt:
    issuer: lab-management-system
    ttl-seconds: 3600
    refresh-ttl-seconds: 604800
    secret: ${LAB_JWT_SECRET:dev-lab-jwt-secret-dev-lab-jwt-secret-dev-lab-jwt-secret}
  sso:
    # dev 默认值与 aspnetcore 仓 appsettings.Development.json 同款（lab-mgmt client 在
    # saas apps 表注册，redirect 白名单 5173/5174 login + 3001 callback）。
    # prod 必走 env 覆盖，client-secret 不得带出本机。
    saas-base: ${LAB_SAAS_BASE:http://localhost:3000}
    client-id: ${LAB_SAAS_CLIENT_ID:lab-mgmt}
    client-secret: ${LAB_SAAS_CLIENT_SECRET:lab-mgmt-secret}
    default-tenant-id: ${LAB_SAAS_DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
    callback-redirect-base: ${LAB_SSO_CALLBACK_REDIRECT:http://localhost:5173/login}
  auth:
    dev-password: ${LAB_AUTH_DEV_PASSWORD:dev123456}
  cors:
    allowed-origins: ${LAB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
