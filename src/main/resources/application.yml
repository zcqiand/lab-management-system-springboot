spring:
  application:
    name: lab-management-system-springboot

  # 默认 profile=sso（真 SaasAuthClient/SaasMeClient，调 saas OAuth）。
  # 4 个 saas env（LAB_SAAS_BASE/CLIENT_ID/CLIENT_SECRET/DEFAULT_TENANT_ID）必填，
  # 缺一启动即被 fail-fast 拒绝（SsoBeansConfig）。
  # 离线 dev：LAB_PROFILE=no-sso 切回 NoopSaasAuthClient。
  # 注意用 spring.profiles.default 而不是 spring.config.activate.on-profile：
  # 后者是「条件包含本配置文档」的守卫，且 profile 名不解析占位符 ——
  # 写在那会把整份 application.yml（含 datasource）变成永不加载。
  profiles:
    default: ${LAB_PROFILE:sso}

  # postgres 直连（ADR 决议 2026-08-18）：lab-shared SQL 本就是 postgres 方言 V001-V013，
  # Flyway 直接 replay，不搞 sqlite 双栈。
  # 与 nextjs 共用一个库。DATABASE_URL 可切走（如空库 replay 演练 / 未来独立实例）；
  # JDBC_URL 兜底兼容 db-env.sh 工作流（与 saas-springboot 同款双层占位符）。
  #
  # ADR-0019：DATABASE_URL 缺失 throw；JDBC_URL 兜底（dev 兼容）保留但要求显式声明。
  datasource:
    url: ${DATABASE_URL:${JDBC_URL:}}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # lab_dev 已由 nextjs 侧（shared schema 同步）建到 V013 等效状态，且无
    # flyway_schema_history：baseline-on-migrate 在其上打 baseline 并跳过 <=13；
    # 空库则不触发 baseline、V001-V013 全量 replay。prod 慎用。
    baseline-on-migrate: true
    baseline-version: "13"
  jpa:
    hibernate:
      # schema 由 Flyway 管（SSOT = shared 仓 sql/migrations），Hibernate 只校验。
      ddl-auto: validate
    open-in-view: false

server:
  # 家族端口约定：springboot=5205（conventions §6 2026-09-02 端口分段：saas=5100 段、lab=5200 段）。
  # SERVER_PORT 是全家族统一监听 key（Spring relaxed binding 原生支持）。
  # ADR-0019：缺失 throw,不允许 "5205" 兜底。dev 期用 .env.local / env-file 显式声明。
  port: ${SERVER_PORT:}

# 健康探针只暴露 health（Docker HEALTHCHECK + deploy 脚本 wget 用）。
# 不开 metrics/env/heapdump 等敏感面（同 saas-springboot）。
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    io.xr.lab: DEBUG

# B1 真后端 OAuth 2.0 + JWT 签发配置（ADR-0008）。
# - Jwt 密钥 ≥32B（HS256），dev 默认占位即可；prod 必走 env。
# - Sso 4 字段 saas-base/client-id/client-secret/default-tenant-id 缺一不可。
# - dev 默认 profile=no-sso（NoopSaasAuthClient），无需 saas 也跑通。
# - prod/CI 切 default profile 走真 saas。
lab:
  jwt:
    # ADR-0019：issuer/ttl 字面默认值删,要求 @ConfigurationProperties 显式声明。
    # secret 缺失 throw（SsoBeansConfig / JwtIssuer 构造器 ISE），与 saas-springboot
    # JwtIssuer.java 模板对齐。
    issuer: ${JWT_ISSUER:}
    ttl-seconds: ${JWT_TTL_SECONDS:}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:}
    secret: ${JWT_SIGNING_KEY:}
  sso:
    # ADR-0019：所有 SSO 凭据 (saas-base / client-id / client-secret / default-tenant-id
    # / service-user / service-password / callback-redirect / cors) 缺失 throw。
    # 详见 SsoBeansConfig 构造器 ISE fail-fast。
    saas-base: ${LAB_SAAS_BASE_URL:}
    # IdP 登录页 base（authorizeUrl 拼 {loginUrl}/login）。该页面由 saas 前端提供；
    # 空 = 回落 saas-base（dev 时 saas-nextjs :5101 既是前端也带 API routes）。
    login-url: ${LAB_SSO_LOGIN_URL:}
    client-id: ${LAB_SAAS_CLIENT_ID:}
    client-secret: ${LAB_SAAS_CLIENT_SECRET:}
    default-tenant-id: ${LAB_SAAS_DEFAULT_TENANT_ID:}
    callback-redirect-base: ${LAB_SSO_CALLBACK_REDIRECT:}
    # 服务账号（2026-08-27 密码登录拉菜单快照用）：lab 密码登录的 dev 用户无 saas
    # 身份,login() 后用它登 saas /auth/login 换 token 拉 /me/menus。
    service-user: ${LAB_SAAS_SERVICE_USER:}
    service-password: ${LAB_SAAS_SERVICE_PASSWORD:}
  auth:
    dev-password: ${LAB_AUTH_DEV_PASSWORD:}
  cors:
    allowed-origins: ${LAB_CORS_ALLOWED_ORIGINS:}
